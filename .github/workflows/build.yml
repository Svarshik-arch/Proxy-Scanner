name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Номер сборки — программа сверяет его с последним выпуском.
  PS_BUILD: ${{ github.run_number }}
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ env.TARGET }}
          rustup default stable
          rustc -Vv

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --target ${{ env.TARGET }}

      # +crt-static задан в .cargo/config.toml
      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Verify the executable is self-contained
        shell: pwsh
        run: |
          foreach ($name in 'proxy-scanner.exe', 'proxy-scanner-cli.exe') {
            $exe = "target/${{ env.TARGET }}/release/$name"
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match '(?i)vcruntime\d+\.dll|msvcp\d+\.dll|api-ms-win-crt') {
              Write-Error "CRT linked dynamically in ${name}: $($Matches[0])"
              exit 1
            }
            "{0}: {1:N1} MB, CRT linked statically" -f $exe, ((Get-Item $exe).Length / 1MB)
          }

      # Командная строка: справка, пресеты, сведения о хосте, ICMP через IcmpSendEcho, DNS.
      - name: CLI smoke test
        shell: pwsh
        run: |
          $cli = "target/${{ env.TARGET }}/release/proxy-scanner-cli.exe"
          & $cli help; if ($LASTEXITCODE) { throw "help: $LASTEXITCODE" }
          & $cli presets dns; if ($LASTEXITCODE) { throw "presets: $LASTEXITCODE" }
          $host_json = & $cli host --json -q | Out-String
          if ($LASTEXITCODE) { throw "host: $LASTEXITCODE" }
          if (($host_json | ConvertFrom-Json).interfaces.Count -lt 1) { throw 'host: no interfaces' }
          $ping = & $cli ping 127.0.0.1 --set cycles=2 --set interval_ms=100 --json -q | Out-String | ConvertFrom-Json
          if ($ping.hops[0].recv -lt 1) { throw "ICMP ping to 127.0.0.1 failed: $($ping | ConvertTo-Json -Depth 5)" }
          & $cli dns example.com A '@8.8.8.8' -q; if ($LASTEXITCODE) { throw "dns: $LASTEXITCODE" }
          $calc = & $cli calc 10.0.0.0/22 /24 | Out-String
          if ($calc -notmatch '10.0.3.0/24') { throw "calc: $calc" }
          & $cli playbook list; if ($LASTEXITCODE) { throw "playbook: $LASTEXITCODE" }

      # Окно открывается и выводит изображение через DirectX 12 (на сервере без
      # видеокарты — программный адаптер Microsoft), затем закрывается само.
      - name: GUI smoke test (DirectX 12)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'graphics.txt'
          $env:PROXY_SCANNER_GRAPHICS_REPORT = $report
          $p = Start-Process "target/${{ env.TARGET }}/release/proxy-scanner.exe" -PassThru -WorkingDirectory $env:RUNNER_TEMP
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'GUI did not close by itself' }
          if (-not (Test-Path $report)) { throw 'no graphics report' }
          $g = Get-Content $report -Raw
          "graphics: $g"
          if ($g -notmatch 'Dx12') { throw "expected DirectX 12, got: $g" }

      # Скрипт запуска в режиме проверки под Windows PowerShell 5.1
      # (программа не запускается, проверяется разбор аргументов и проверки окружения).
      - name: Launcher script (check mode)
        shell: powershell
        run: |
          $dir = "target/$env:TARGET/release"
          Copy-Item release/proxy-scanner.ps1, release/proxy-scanner.cmd $dir
          $out = & "$dir/proxy-scanner.cmd" -CheckOnly -NoInstall --renderer glow 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "launcher exited with $LASTEXITCODE" }
          if ($out -notmatch '\[--renderer\] \[glow\]') { throw 'arguments were not passed through' }
          if ($out -notmatch 'CheckOnly') { throw 'check mode did not finish' }

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-scanner-windows-x64
          path: |
            target/${{ env.TARGET }}/release/proxy-scanner.exe
            target/${{ env.TARGET }}/release/proxy-scanner-cli.exe
          if-no-files-found: error

  # masscan64.exe из официальных исходников (github.com/robertdavidgraham/masscan).
  # Npcap (wpcap.dll) masscan подгружает во время работы, для сборки он не нужен.
  masscan:
    runs-on: windows-latest
    env:
      MASSCAN_TAG: "1.3.2"
      MASSCAN_COMMIT: 06902c40d1494881c17b7968ef530e1d6bbd320c
    steps:
      - name: Checkout masscan
        uses: actions/checkout@v4
        with:
          repository: robertdavidgraham/masscan
          ref: ${{ env.MASSCAN_TAG }}
          path: masscan

      - name: Verify source revision
        shell: pwsh
        run: |
          $sha = git -C masscan rev-parse HEAD
          if ($sha -ne $env:MASSCAN_COMMIT) {
            Write-Error "Tag $env:MASSCAN_TAG points to $sha, expected $env:MASSCAN_COMMIT"
            exit 1
          }

      # string_s.h в 1.3.2 узнаёт только MSVC 2015 (_MSC_VER == 1900); более новые
      # версии попадают в ветку "#warning unknown compiler", которую MSVC не понимает.
      # Расширяем условие на все MSVC начиная с 2015 — других изменений в исходниках нет.
      - name: Patch compiler detection for current MSVC
        shell: pwsh
        working-directory: masscan
        run: |
          $f = Join-Path $PWD "src/string_s.h"
          $old = '(_MSC_VER == 1900)'
          $text = [IO.File]::ReadAllText($f)
          if (-not $text.Contains($old)) { Write-Error "pattern not found in $f"; exit 1 }
          [IO.File]::WriteAllText($f, $text.Replace($old, '(_MSC_VER >= 1900)'))
          git diff

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # /MT — статический CRT: masscan64.exe не требует VC++ Redistributable.
      - name: Build
        shell: cmd
        working-directory: masscan
        run: >-
          cl /nologo /O2 /MT /W1
          /DWIN32 /DNDEBUG /D_CONSOLE /D_CRT_SECURE_NO_WARNINGS /D_WINSOCK_DEPRECATED_NO_WARNINGS
          src\*.c /Fe:masscan64.exe
          /link advapi32.lib setargv.obj

      - name: Smoke test
        shell: pwsh
        working-directory: masscan
        run: |
          $out = & .\masscan64.exe --version 2>&1 | Out-String
          $out
          # masscan --version завершается с ненулевым кодом, поэтому проверяем только вывод.
          if ($out -notmatch "Masscan version $env:MASSCAN_TAG") { Write-Error "unexpected --version output"; exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: masscan64-windows-x64
          path: |
            masscan/masscan64.exe
            masscan/LICENSE
          if-no-files-found: error

  # Linux-сборка приложения. Ubuntu 22.04 (glibc 2.35) — чтобы бинарник
  # запускался и на не самых новых дистрибутивах.
  linux:
    runs-on: ubuntu-22.04
    env:
      LINUX_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target $LINUX_TARGET
          rustup default stable
          rustc -Vv

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Tests
        run: cargo test --locked --target $LINUX_TARGET

      - name: Build
        run: cargo build --release --locked --target $LINUX_TARGET

      - name: Inspect binary
        run: |
          f=target/$LINUX_TARGET/release/proxy-scanner
          file "$f"
          echo "Динамические зависимости (графика и окна подгружаются во время работы):"
          ldd "$f" || true
          objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      - name: CLI smoke test
        run: |
          cli=target/$LINUX_TARGET/release/proxy-scanner-cli
          $cli help
          $cli presets
          $cli host -q | head -20
          # UDP-трассировка работает без прав (IP_RECVERR).
          $cli mtr 127.0.0.1 --set mode=Udp --set cycles=2 --set interval_ms=100 --json -q > mtr.json
          python3 -c "import json; r=json.load(open('mtr.json')); assert r['hops'][0]['recv'] >= 1, r"
          $cli dns example.com A @8.8.8.8 -q
          $cli calc 10.0.0.0/22 /24 | grep -q 10.0.3.0/24
          $cli playbook list

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-scanner-linux-x64
          path: |
            target/${{ env.LINUX_TARGET }}/release/proxy-scanner
            target/${{ env.LINUX_TARGET }}/release/proxy-scanner-cli
          if-no-files-found: error

  # masscan для Linux из тех же официальных исходников 1.3.2.
  # libpcap masscan подгружает во время работы, для сборки он не нужен.
  masscan-linux:
    runs-on: ubuntu-22.04
    env:
      MASSCAN_TAG: "1.3.2"
      MASSCAN_COMMIT: 06902c40d1494881c17b7968ef530e1d6bbd320c
    steps:
      - name: Checkout masscan
        uses: actions/checkout@v4
        with:
          repository: robertdavidgraham/masscan
          ref: ${{ env.MASSCAN_TAG }}
          path: masscan

      - name: Verify source revision
        run: |
          sha=$(git -C masscan rev-parse HEAD)
          if [ "$sha" != "$MASSCAN_COMMIT" ]; then
            echo "Tag $MASSCAN_TAG points to $sha, expected $MASSCAN_COMMIT" >&2
            exit 1
          fi

      - name: Build
        working-directory: masscan
        run: make -j"$(nproc)"

      - name: Smoke test
        working-directory: masscan
        run: |
          out=$(./bin/masscan --version 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Masscan version $MASSCAN_TAG"
          file bin/masscan
          ldd bin/masscan || true

      - uses: actions/upload-artifact@v4
        with:
          name: masscan-linux-x64
          path: |
            masscan/bin/masscan
            masscan/LICENSE
          if-no-files-found: error

  # Готовые архивы на странице релизов — после каждой успешной сборки ветки main.
  # Ссылки вида releases/latest/download/<архив> всегда ведут на последнюю сборку.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, masscan, linux, masscan-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Package
        run: |
          set -euo pipefail
          w=pkg/win/proxy-scanner; l=pkg/lin/proxy-scanner
          mkdir -p "$w" "$l" dist
          cp art/proxy-scanner-windows-x64/*.exe art/masscan64-windows-x64/masscan64.exe "$w/"
          cp art/masscan64-windows-x64/LICENSE "$w/masscan-LICENSE"
          cp release/proxy-scanner.ps1 release/proxy-scanner.cmd release/README.md docs/TOOLS.md "$w/"
          cp art/proxy-scanner-linux-x64/proxy-scanner art/proxy-scanner-linux-x64/proxy-scanner-cli art/masscan-linux-x64/bin/masscan "$l/"
          cp art/masscan-linux-x64/LICENSE "$l/masscan-LICENSE"
          cp release/proxy-scanner.sh release/README.md docs/TOOLS.md "$l/"
          chmod +x "$l/proxy-scanner" "$l/proxy-scanner-cli" "$l/masscan" "$l/proxy-scanner.sh"
          (cd pkg/win && zip -qr9 ../../dist/proxy-scanner-windows-x64.zip proxy-scanner)
          (cd pkg/lin && tar czf ../../dist/proxy-scanner-linux-x64.tar.gz proxy-scanner)
          (cd dist && sha256sum proxy-scanner-windows-x64.zip proxy-scanner-linux-x64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          n=${{ github.run_number }}
          tag="v$ver-build.$n"
          {
            echo "Сборка из коммита ${GITHUB_SHA::7}."
            echo
            echo "| Система | Архив |"
            echo "|---|---|"
            echo "| Windows 10/11 x64 | \`proxy-scanner-windows-x64.zip\` — распаковать и запустить \`proxy-scanner.cmd\` или \`proxy-scanner.exe\` |"
            echo "| Linux x64 (glibc 2.35+) | \`proxy-scanner-linux-x64.tar.gz\` — распаковать и запустить \`./proxy-scanner.sh\` |"
            echo
            echo "В архивах: программа с окном, программа для командной строки, masscan 1.3.2 из официальных исходников, скрипт запуска, описание инструментов."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$tag" dist/proxy-scanner-windows-x64.zip dist/proxy-scanner-linux-x64.tar.gz dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Proxy Scanner $ver — сборка $n" --notes-file notes.md --latest
          # На странице оставляем три последние сборки.
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
