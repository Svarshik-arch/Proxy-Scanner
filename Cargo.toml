[package]
name = "proxy-scanner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Инвентаризация и диагностика прокси-серверов в корпоративной сети"
license = "MIT"

[[bin]]
name = "proxy-scanner"
path = "src/main.rs"

# Консольная версия для командной строки и скриптов (в Windows основная программа — оконная).
[[bin]]
name = "proxy-scanner-cli"
path = "src/bin/cli.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "clipboard",
    "accesskit",
    "persistence",
    "wgpu",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.37"
egui_extras = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "process", "macros", "signal"] }
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18"
# JavaScript-движок для вычисления PAC-файлов (чистый Rust).
boa_engine = { version = "0.22", default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
md4 = "0.11"
md-5 = "0.11"
hmac = "0.13"
rustls-native-certs = "0.8"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
miniz_oxide = "0.8"
libloading = "0.8"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "des"] }
vt100 = "0.18"
similar = "3"
serialport = { version = "4", default-features = false }
chacha20poly1305 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
